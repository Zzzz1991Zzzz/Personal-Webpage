<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Yang Zhang</title>
    <meta
      name="description"
      content="Academic website of Yang Zhang, M.S. student in Computer Engineering at UC San Diego working on NLP, large language models, and reinforcement learning."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Crimson+Text:ital,wght@0,400;0,600;0,700;1,400&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css?v=2" />
  </head>
  <body>
    <main class="container">
      <!-- Header / Identity -->
      <header class="site-header">
        <div class="header-main">
          <div class="header-identity">
            <h1 id="full-name">Yang Zhang</h1>
            <p class="affiliation" id="affiliation"></p>
            <p class="affiliation" id="email-line"></p>
            <nav class="header-links" id="header-links" aria-label="Profile links"></nav>
          </div>
          <div class="portrait" id="portrait">
            <img alt="Portrait of Yang Zhang" width="600" height="600" decoding="async" />
          </div>
        </div>
      </header>

      <!-- Bio -->
      <section class="bio" id="bio"></section>

      <!-- News -->
      <section class="section" id="news-section">
        <h2>News</h2>
        <ul class="news-list" id="news-list"></ul>
      </section>

      <!-- Publications -->
      <section class="section" id="publications-section">
        <h2>Publications</h2>
        <p class="section-note">
          * indicates equal contribution. You may also refer to my
          <a id="scholar-link-pub" href="#" target="_blank" rel="noopener">Google Scholar</a> page.
        </p>
        <div id="publications-list"></div>
      </section>

      <!-- Service -->
      <section class="section" id="service-section">
        <h2>Service</h2>
        <ul class="service-list" id="service-list"></ul>
      </section>
    </main>

    <footer class="site-footer">
      <div class="container">
        <hr />
        <p class="footer-text" id="footer-updated">Last updated September 2026.</p>
      </div>
    </footer>

    <script src="data/profile.js"></script>
    <script src="script.js"></script>
  </body>
</html>
